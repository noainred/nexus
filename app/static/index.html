<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nexus 통합 관리</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Nexus 통합 관리</h1>
      <div class="instance-picker">
        <label for="instance-select">인스턴스</label>
        <select id="instance-select"></select>
        <button id="refresh-btn" title="새로고침">↻</button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="overview">개요</button>
      <button class="tab" data-tab="matrix">비교 매트릭스</button>
      <button class="tab" data-tab="repositories">저장소</button>
      <button class="tab" data-tab="cleanup">정리 정책</button>
    </nav>

    <main>
      <section id="overview" class="panel active">
        <h2>인스턴스 상태</h2>
        <div id="status-cards" class="cards"></div>
        <h2>Blob Store 사용량</h2>
        <div id="blobstore-table"></div>
      </section>

      <section id="matrix" class="panel">
        <div class="matrix-header">
          <h2>저장소 구성 비교 (인스턴스 × 저장소)</h2>
          <label class="drift-only">
            <input type="checkbox" id="drift-only" />
            차이가 있는 항목만 보기
          </label>
        </div>
        <div class="legend">
          <span><i class="sw consistent"></i> 일치</span>
          <span><i class="sw drift"></i> 설정 상이(drift)</span>
          <span><i class="sw missing"></i> 누락</span>
          <span><i class="sw unknown"></i> 조회 불가</span>
        </div>
        <div id="matrix-table" class="matrix-wrap"></div>
      </section>

      <section id="repositories" class="panel">
        <h2>저장소 목록</h2>
        <div id="repo-table"></div>
        <h2 id="component-heading" class="hidden">컴포넌트</h2>
        <div id="component-table"></div>
        <div id="component-pager" class="pager hidden">
          <button id="component-more">더 보기</button>
        </div>
      </section>

      <section id="cleanup" class="panel">
        <h2>정리(Cleanup) 정책</h2>
        <div id="cleanup-table"></div>
        <h3>새 정책 만들기</h3>
        <form id="cleanup-form" class="form">
          <label>이름 <input name="name" required /></label>
          <label>포맷
            <select name="format">
              <option value="*">* (모든 포맷)</option>
              <option value="maven2">maven2</option>
              <option value="npm">npm</option>
              <option value="docker">docker</option>
              <option value="pypi">pypi</option>
              <option value="raw">raw</option>
            </select>
          </label>
          <label>마지막 업데이트 후 N일 경과
            <input name="criteria_last_blob_updated" type="number" min="1" />
          </label>
          <label>마지막 다운로드 후 N일 경과
            <input name="criteria_last_downloaded" type="number" min="1" />
          </label>
          <label>메모 <input name="notes" /></label>
          <button type="submit">정책 생성</button>
        </form>
        <p class="hint">
          ※ 최소 한 개 이상의 기준(N일)을 입력해야 합니다.
        </p>
      </section>
    </main>

    <div id="toast" class="toast hidden"></div>
    <script src="/static/app.js"></script>
  </body>
</html>
