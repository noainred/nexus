name: Build release archive

# Every push to the dev branch (i.e. every version bump) rebuilds
# downloadable archives — the offline bundle (source + all Python wheels)
# and a source-only tarball — and publishes them to a per-version release
# (vX.Y.Z) and a rolling "latest" release. An air-gapped server then only
# needs to download ONE file.
on:
  push:
    branches:
      - claude/practical-noether-uPpi9
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Host Python (for packaging/zip only). The wheelhouse itself is built
      # inside a python:3.6 container below so cp36 wheels + environment markers
      # (e.g. the dataclasses backport) resolve for the CentOS 7.9 target.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read app version
        id: ver
        run: |
          V=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' app/__init__.py | head -1)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # Build the cp36 wheelhouse in real Python 3.6 (glibc 2.17 in the debian
      # image = CentOS 7 compatible). Markers + wheel tags resolve correctly here.
      - name: Build cp36 wheelhouse (python:3.6 container)
        run: |
          # pip wheel (not pip download --only-binary): builds pure-Python
          # sdist-only transitive deps (e.g. the contextvars backport that
          # sniffio needs on 3.6) into wheels, so the offline target installs
          # with no compiler. C-extension deps still use their prebuilt cp36
          # manylinux wheels.
          docker run --rm -v "$PWD":/w -w /w python:3.6 \
            sh -c 'python -m pip install -q --upgrade "pip==21.3.1" "wheel<0.38" && \
                   rm -rf wheelhouse && mkdir -p wheelhouse && \
                   python -m pip wheel -r requirements.txt -w wheelhouse'
          echo "wheelhouse files: $(ls wheelhouse | wc -l)"

      - name: Package offline bundle (source + prebuilt wheelhouse)
        env:
          WHEELHOUSE_READY: "1"
        run: bash deploy/build-offline-bundle.sh "nexus-manager-offline-v${{ steps.ver.outputs.version }}.tar.gz"

      - name: Build source-only archive
        run: |
          git archive --format=tar.gz -o "nexus-manager-src-v${{ steps.ver.outputs.version }}.tar.gz" HEAD
          git archive --format=zip -o "nexus-manager-src-v${{ steps.ver.outputs.version }}.zip" HEAD

      - name: Publish per-version and latest releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -e
          VER_OFFLINE="nexus-manager-offline-v${VERSION}.tar.gz"
          VER_OFFLINE_ZIP="nexus-manager-offline-v${VERSION}.zip"
          VER_SRC="nexus-manager-src-v${VERSION}.tar.gz"
          VER_SRC_ZIP="nexus-manager-src-v${VERSION}.zip"
          VER_MD="ver_${VERSION}.md"     # created by the build script
          NOTES="Auto-built from ${GITHUB_SHA} (app v${VERSION})"

          # Stable-named copies so the rolling latest URLs never change.
          cp "$VER_OFFLINE" nexus-manager-offline.tar.gz
          cp "$VER_OFFLINE_ZIP" nexus-manager-offline.zip
          cp "$VER_SRC" nexus-manager-src.tar.gz
          cp "$VER_SRC_ZIP" nexus-manager-src.zip

          # Per-version release: version-stamped filenames, kept forever.
          # versions.json (auto-generated) lets the manager / intranet mirror
          # auto-update without anyone hand-writing it.
          printf '{"version":"%s","file":"%s"}\n' "$VERSION" "$VER_OFFLINE_ZIP" > versions.json
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "$VER_OFFLINE" "$VER_OFFLINE_ZIP" "$VER_SRC" "$VER_SRC_ZIP" "$VER_MD" versions.json --clobber
            gh release edit "v${VERSION}" --title "v${VERSION}" --notes "$NOTES"
          else
            gh release create "v${VERSION}" "$VER_OFFLINE" "$VER_OFFLINE_ZIP" "$VER_SRC" "$VER_SRC_ZIP" "$VER_MD" versions.json \
              --target "$GITHUB_SHA" --title "v${VERSION}" --notes "$NOTES"
          fi

          # Rolling latest: stable filenames + version marker + versions.json
          # (points at the stable zip name, so the latest URLs never change).
          printf '{"version":"%s","file":"%s"}\n' "$VERSION" "nexus-manager-offline.zip" > versions.json
          if gh release view latest >/dev/null 2>&1; then
            for OLD in $(gh release view latest --json assets -q '.assets[].name' | grep '^ver_' || true); do
              [ "$OLD" = "$VER_MD" ] || gh release delete-asset latest "$OLD" -y || true
            done
            gh release upload latest nexus-manager-offline.tar.gz nexus-manager-offline.zip nexus-manager-src.tar.gz nexus-manager-src.zip "$VER_MD" versions.json --clobber
            gh release edit latest --title "latest (v${VERSION})" --notes "$NOTES"
          else
            gh release create latest nexus-manager-offline.tar.gz nexus-manager-offline.zip nexus-manager-src.tar.gz nexus-manager-src.zip "$VER_MD" versions.json \
              --target "$GITHUB_SHA" --title "latest (v${VERSION})" --notes "$NOTES" --prerelease
          fi
